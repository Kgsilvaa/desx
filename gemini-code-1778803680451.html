<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dry Sex AI | Premium Generation</title>
    <style>
        /* CSS INTEGRADO */
        :root {
            --preto-profundo: #0a0a0a;
            --preto-card: #141414;
            --dourado-brilhante: #e5c05b;
            --dourado-dark: #b89130;
            --texto-cinza: #a0a0a0;
            --shadow-gold: rgba(229, 192, 91, 0.2);
        }

        * {
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--preto-profundo);
            color: white;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        nav {
            width: 260px;
            background-color: #000;
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            padding: 25px;
            justify-content: space-between;
            z-index: 10;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--dourado-brilhante);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 40px;
            text-align: center;
            border-bottom: 2px solid var(--dourado-dark);
            padding-bottom: 10px;
            text-shadow: 0 0 10px var(--shadow-gold);
        }

        .menu-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu-item {
            padding: 12px 15px;
            color: var(--texto-cinza);
            text-decoration: none;
            border-radius: 10px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-item:hover, .menu-item.active {
            background-color: #1a1a1a;
            color: var(--dourado-brilhante);
            transform: translateX(5px);
        }

        .premium-btn {
            background: linear-gradient(45deg, var(--dourado-dark), var(--dourado-brilhante));
            color: black !important;
            font-weight: bold;
            text-align: center;
            justify-content: center;
        }

        /* Main Area */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at top right, #1a1a1a, #0a0a0a);
        }

        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .badge {
            border: 1px solid var(--dourado-brilhante);
            color: var(--dourado-brilhante);
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* Content Area */
        .content-area {
            flex-grow: 1;
            overflow-y: auto;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .hero-text {
            text-align: center;
            max-width: 600px;
        }

        .hero-text h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            background: linear-gradient(to bottom, #fff, var(--dourado-brilhante));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-text p {
            color: var(--texto-cinza);
            font-size: 1.1rem;
        }

        /* Input Box */
        .input-wrapper {
            width: 100%;
            max-width: 850px;
            padding: 20px 40px 40px;
            margin: 0 auto;
        }

        .prompt-box {
            background: var(--preto-card);
            border: 1px solid #333;
            border-radius: 20px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .prompt-box:focus-within {
            border-color: var(--dourado-brilhante);
            box-shadow: 0 0 15px var(--shadow-gold);
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            font-size: 1.1rem;
            resize: none;
            outline: none;
            min-height: 60px;
            padding: 10px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid #222;
        }

        .options-chips {
            display: flex;
            gap: 10px;
        }

        .chip {
            background: #222;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            color: var(--texto-cinza);
        }

        .chip:hover {
            background: #333;
            color: white;
        }

        .generate-btn {
            background: linear-gradient(45deg, var(--dourado-dark), var(--dourado-brilhante));
            color: black;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px var(--shadow-gold);
        }

        /* Loading Animation */
        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #000;
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <nav>
        <div class="top">
            <div class="logo">Dry Sex AI</div>
            <div class="menu-group">
                <a href="#" class="menu-item active">✨ Nova Geração</a>
                <a href="#" class="menu-item">📂 Galeria Privada</a>
                <a href="#" class="menu-item">🎥 Meus Vídeos</a>
                <a href="#" class="menu-item">🔥 Tendências</a>
            </div>
        </div>
        
        <div class="menu-group">
            <a href="#" class="menu-item premium-btn">⭐ ASSINAR PRO</a>
            <a href="#" class="menu-item">⚙️ Ajustes</a>
        </div>
    </nav>

    <main>
        <header>
            <div class="badge">Acesso VIP Unrestricted</div>
            <div style="color: var(--texto-cinza)">Créditos: <span style="color: var(--dourado-brilhante)">♾️ Ilimitado</span></div>
        </header>

        <div class="content-area" id="main-content">
            <div class="hero-text">
                <h1>Criatividade sem limites.</h1>
                <p>Crie imagens e vídeos adultos de alta fidelidade em segundos usando a engine Dry Sex.</p>
            </div>
        </div>

        <div class="input-wrapper">
            <div class="prompt-box">
                <textarea id="prompt" placeholder="Descreva sua fantasia aqui..."></textarea>
                <div class="controls">
                    <div class="options-chips">
                        <div class="chip">📸 Imagem</div>
                        <div class="chip">🎬 Vídeo 60s</div>
                        <div class="chip">💎 4K Ultra</div>
                    </div>
                    <button class="generate-btn" id="generateBtn">
                        <span id="btnText">GERAR AGORA</span>
                        <div class="loader" id="loader"></div>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // JAVASCRIPT INTEGRADO
        const btn = document.getElementById('generateBtn');
        const loader = document.getElementById('loader');
        const btnText = document.getElementById('btnText');
        const contentArea = document.getElementById('main-content');

        btn.addEventListener('click', () => {
            const promptValue = document.getElementById('prompt').value;
            
            if(!promptValue) {
                alert("Por favor, digite um comando primeiro!");
                return;
            }

            // Simulação de carregamento
            btnText.style.display = 'none';
            loader.style.display = 'block';
            btn.style.opacity = '0.7';

            setTimeout(() => {
                loader.style.display = 'none';
                btnText.style.display = 'block';
                btnText.innerText = 'GERAR NOVAMENTE';
                btn.style.opacity = '1';

                // Simulação de resposta no chat
                const result = document.createElement('div');
                result.style.marginTop = '20px';
                result.style.padding = '20px';
                result.style.background = '#141414';
                result.style.borderRadius = '15px';
                result.style.border = '1px solid #e5c05b';
                result.innerHTML = `<p style="color:#e5c05b"><b>Sistema:</b> Geração iniciada para: "${promptValue}"</p>
                                    <p style="font-size: 0.8rem; color: #777;">Aguardando renderização da GPU...</p>`;
                
                contentArea.innerHTML = ''; // Limpa o texto inicial
                contentArea.appendChild(result);
            }, 2000);
        });
    </script>
</body>
</html>
